      - name: Install image validation library
        run: python3 -m pip install Pillow==12.0.0
      - name: Bundle reviewed mosque photographs
        run: python3 tools/prepare-mosque-assets.py
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: platforms;android-34 build-tools;34.0.0
      - uses: gradle/actions/setup-gradle@v4
      - name: Run tests and build APK
        working-directory: launcher
        run: bash ./gradlew --no-daemon testReleaseUnitTest assembleRelease
      - name: Prepare APK
        run: |
          test "$(stat -c %s launcher/app/build/outputs/apk/release/app-release.apk)" -lt 8388608
          cp launcher/app/build/outputs/apk/release/app-release.apk Home-Marang.apk
      - uses: actions/upload-artifact@v4
        with:
          name: Home-Marang
          path: Home-Marang.apk
          if-no-files-found: error
          retention-days: 30
